<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working With Numbers</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.5.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.5.1/core.js"></script>
</head>
<body>

    <div class="container">
        <div class="card shadow p-4">

            <h1 class="text-center mb-4">
                Working With Numbers
            </h1>

            <input type="number" id="num1" class="form-control mb-3" placeholder="Enter First Number">

            <input type="number" id="num2" class="form-control mb-3" placeholder="Enter Second Number">

            <button py-click="compute" class="btn btn-success w-100">
                Compute
            </button>

            <div id="result" class="mt-4"></div>

        </div>
    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
